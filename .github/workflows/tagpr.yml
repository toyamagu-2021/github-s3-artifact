name: tagpr

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - id: tagpr
        uses: Songmu/tagpr@v1
        with:
          config: .github/tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update floating major tag (v0 / v1+)
        if: steps.tagpr.outputs.tag != '' && startsWith(steps.tagpr.outputs.tag, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAJOR_TAG="${RELEASE_TAG%%.*}"
          git fetch origin tag "${RELEASE_TAG}" --no-tags
          git tag -f "${MAJOR_TAG}" "${RELEASE_TAG}^{commit}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "refs/tags/${MAJOR_TAG}" --force
