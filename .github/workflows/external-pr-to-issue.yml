# Fork pull requests are closed and reopened as issues.
# pull_request_target is required so the token can close the PR.
# This job does not check out the pull request and does not run its code.
name: External pull requests become issues

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  issues-only:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue and close the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY'
          import json
          import os
          import subprocess

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          pr = event["pull_request"]
          repo = os.environ["GITHUB_REPOSITORY"]
          title = (pr.get("title") or "External pull request").strip()
          author = pr["user"]["login"]
          url = pr["html_url"]
          number = pr["number"]
          body = pr.get("body") or ""
          if len(body) > 20000:
              body = body[:20000] + "\n\n...(truncated)"
          issue_title = f"Proposal: {title}"
          if len(issue_title) > 240:
              issue_title = issue_title[:237] + "..."
          description = body.strip() or "_No description._"
          issue_body = (
              "This repository takes external proposals as issues. "
              f"Pull request {url} from @{author} was closed without merge.\n\n"
              "## Original description\n\n"
              f"{description}\n"
          )
          issue_path = "/tmp/external-pr-issue.json"
          with open(issue_path, "w", encoding="utf-8") as handle:
              json.dump({"title": issue_title, "body": issue_body}, handle)
          created = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/issues", "--input", issue_path]
          )
          issue_url = json.loads(created)["html_url"]
          comment_path = "/tmp/external-pr-comment.json"
          with open(comment_path, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "body": (
                          "External pull requests are not merged here. "
                          f"The proposal is now an issue: {issue_url}"
                      )
                  },
                  handle,
              )
          subprocess.check_call(
              [
                  "gh",
                  "api",
                  f"repos/{repo}/issues/{number}/comments",
                  "--input",
                  comment_path,
              ]
          )
          subprocess.check_call(
              [
                  "gh",
                  "api",
                  "--method",
                  "PATCH",
                  f"repos/{repo}/pulls/{number}",
                  "-f",
                  "state=closed",
              ]
          )
          PY
