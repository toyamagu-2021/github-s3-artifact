\* Two runAttempt=2 jobs with overwrite:false replace a live attempt-1 artifact.
\* GetManifest uses existing.manifest.runAttempt < GITHUB_RUN_ATTEMPT, then CAS.
SPECIFICATION Spec
CONSTANTS
  u1 = u1
  u2 = u2
  Seeded = TRUE
  AllOverwrite = FALSE
  JobAttempt = 2
INVARIANTS
  TypeOK
  CommittedBlobExists
  SameAttemptExclusive
  DoneIsCurrentOrReplacedBySnapshot
